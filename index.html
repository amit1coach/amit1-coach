<script>
// Initialize Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDJ4eH7n4xZH6UkGmvVNDu8W9npnoklsEs",
  authDomain: "amit1-9b45d.firebaseapp.com",
  projectId: "amit1-9b45d",
  storageBucket: "amit1-9b45d.firebasestorage.app",
  messagingSenderId: "654375010027",
  appId: "1:654375010027:web:b34774524c4cd67ff748ae"
};
firebase.initializeApp(firebaseConfig);
const _auth = firebase.auth();
const _db = firebase.firestore();

// Firebase helpers using compat API
const fb = () => ({
  auth: _auth,
  db: _db
});

const dbGet = async (path) => {
  const parts = path.split("/");
  let ref = _db;
  for (let i = 0; i < parts.length; i++) {
    ref = i % 2 === 0 ? ref.collection(parts[i]) : ref.doc(parts[i]);
  }
  const snap = await ref.get();
  return snap.exists ? snap.data() : null;
};

const dbSet = async (path, data) => {
  const parts = path.split("/");
  let ref = _db;
  for (let i = 0; i < parts.length; i++) {
    ref = i % 2 === 0 ? ref.collection(parts[i]) : ref.doc(parts[i]);
  }
  await ref.set(data, {merge: true});
};

const dbDel = async (path) => {
  const parts = path.split("/");
  let ref = _db;
  for (let i = 0; i < parts.length; i++) {
    ref = i % 2 === 0 ? ref.collection(parts[i]) : ref.doc(parts[i]);
  }
  await ref.delete();
};

const dbList = async (col) => {
  const snap = await _db.collection(col).get();
  return snap.docs.map(d => ({id: d.id, ...d.data()}));
};

const dbGetPlan = async (athleteId, off=0) => {
  try {
    const snap = await _db.collection(`plans/${athleteId}/weeks`).get();
    if (snap.empty) return null;
    const wk = weekKey(off);
    const docList = snap.docs.map(d => ({id: d.id, data: d.data()}));
    const exact = docList.find(d => d.id === wk);
    if (exact) return exact.data;
    for (let delta = -2; delta <= 2; delta++) {
      if (delta === 0) continue;
      const base = new Date(wk + "T12:00:00");
      base.setDate(base.getDate() + delta);
      const tryKey = base.getFullYear()+"-"+String(base.getMonth()+1).padStart(2,"0")+"-"+String(base.getDate()).padStart(2,"0");
      const found = docList.find(d => d.id === tryKey);
      if (found) return found.data;
    }
    return null;
  } catch(e) { console.error("dbGetPlan error:", e); return null; }
};

const {useState,useEffect,useCallback,useRef,createElement:h,Fragment} = React;

// ── Constants ─────────────────────────────────────────────────────────────────
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WT = {
  easy:    {label:"Easy run",  color:"#2ECC71",bg:"var(--success-bg)",dark:"var(--success-text)"},
  tempo:   {label:"Tempo",     color:"#BF00FF",bg:"var(--wt-tempo-bg)",dark:"var(--wt-tempo-text)"},
  interval:{label:"Intervals", color:"#FF0090",bg:"var(--wt-interval-bg)",dark:"var(--wt-interval-text)"},
  long:    {label:"Long run",  color:"#A78BFA",bg:"var(--wt-long-bg)",dark:"var(--wt-long-text)"},
  race:    {label:"Race",      color:"#E05C5C",bg:"var(--danger-bg)",dark:"var(--danger-text)"},
  strength:{label:"Strength",  color:"#F97316",bg:"var(--wt-strength-bg)",dark:"var(--wt-strength-text)"},
  recovery:{label:"Recovery",  color:"#06B6D4",bg:"var(--wt-recovery-bg)",dark:"var(--wt-recovery-text)"},
  hills:   {label:"Hill reps", color:"#A0784A",bg:"var(--wt-hills-bg)",dark:"var(--wt-hills-text)"},
  fartlek: {label:"Fartlek",   color:"#7C3AED",bg:"var(--wt-fartlek-bg)",dark:"var(--wt-fartlek-text)"},
  rest:    {label:"Rest / Off",color:"#8A9BB0",bg:"var(--neutral-bg)",dark:"var(--text-muted2)"},
};
const LVL = {
  serious:     {label:"Serious",     bg:"var(--wt-long-bg)",color:"var(--wt-long-text)",border:"#A78BFA"},
  recreational:{label:"Recreational",bg:"var(--info-bg)",color:"var(--info-text)",border:"#3B9EFF"},
};
const SS = {
  done:    {bg:"var(--success-bg)",color:"var(--success-text)",border:"#2ECC71",label:"✓ Done"},
  modified:{bg:"var(--warning-bg)",color:"var(--warning-text)",border:"#F5A623",label:"~ Modified"},
  skipped: {bg:"var(--danger-bg)",color:"var(--danger-text)",border:"#E05C5C",label:"✕ Skipped"},
};
const COACH_EMAIL = "amit@coach.amit1";

// ── Utils ─────────────────────────────────────────────────────────────────────
const DAYS_IDX = Object.fromEntries(DAYS.map((d,i)=>[d,i]));
const getWeekStart = (off=0) => {
  const d=new Date();
  const day=d.getDay(); // 0=Sun
  d.setDate(d.getDate()-day+off*7);
  d.setHours(0,0,0,0);
  return d;
};
const weekKey = (off=0) => {
  const d = new Date();
  // Subtract current day-of-week to get to Sunday, apply week offset
  d.setDate(d.getDate() - d.getDay() + (off * 7));
  // Use local date components to avoid UTC timezone shift
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const weekLabel = (off=0) => {const s=getWeekStart(off),e=new Date(s);e.setDate(s.getDate()+6);return `${s.getDate()}/${s.getMonth()+1} – ${e.getDate()}/${e.getMonth()+1}`;};
const todayShort = () => DAYS[new Date().getDay()];
const monthKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const prevMonthKey = (d=new Date()) => monthKey(new Date(d.getFullYear(), d.getMonth()-1, 1));
const monthLabel = (d=new Date()) => d.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
const initials = n => n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const ccColor  = p => p===null?{bg:"var(--neutral-bg)",color:"var(--text-muted)"}:p>=80?{bg:"var(--success-bg)",color:"var(--success-text)"}:p>=50?{bg:"var(--warning-bg)",color:"var(--warning-text)"}:{bg:"var(--danger-bg)",color:"var(--danger-text)"};
const newPart  = (type="easy") => ({type,mode:"distance",distance:"",duration:"",pace:"",notes:"",_showPace:false,_showKm:false});
const newSess  = () => ({parts:[newPart()],wu:"",cd:""});
const newDay   = (rest=false,sessions=null) => ({restDay:rest,sessions:sessions||[newSess()]});
const sessTotalKm = s => (parseFloat(s?.wu)||0) + (s?.parts||[]).reduce((t,p)=>t+(parseFloat(p.distance)||0),0) + (parseFloat(s?.cd)||0);
const dayTotalKm  = d => (d?.sessions||[]).reduce((t,s)=>t+sessTotalKm(s),0);
const dayIsRest   = d => !d||d.restDay||(d.sessions||[]).length===0;
const sessFirstType = s => s.parts&&s.parts.length>0?s.parts[0].type:"easy";
const stressEmoji = v => { v=parseInt(v); return v<=2?"🙂":v===3?"😐":"😣"; };

// Bulletproof plan normalization — handles any format Firebase might return
const normalizePart = p => {
  if(!p||typeof p!=="object") return newPart();
  // hillRows/wktRows might be nested inside the array items or at the top level
  const hillRows = p.hillRows || null;
  const wktRows = p.wktRows || null;
  return {
    type:p.type||"easy",
    mode:p.mode==="time"?"time":"distance",
    distance:p.distance||"",
    duration:p.duration||"",
    pace:p.pace||"",
    notes:p.notes||"",
    _showPace:!!(p.pace||p._showPace),
    _showKm:!!(p.distance||p._showKm),
    ...(hillRows ? {hillRows: Array.isArray(hillRows) ? hillRows : Object.values(hillRows)} : {}),
    ...(wktRows ? {wktRows: Array.isArray(wktRows) ? wktRows : Object.values(wktRows)} : {}),
    ...(p.wktPattern==="sequential" ? {wktPattern:"sequential"} : {})
  };
};
const normalizeSess = s => {
  if(!s||typeof s!=="object") return newSess();
  // has parts array
  if(Array.isArray(s.parts)&&s.parts.length>0) return { parts:s.parts.map(normalizePart), wu:s.wu||"", cd:s.cd||"" };
  // old format with type directly on session
  if(s.type) return { parts:[normalizePart(s)], wu:s.wu||"", cd:s.cd||"" };
  return newSess();
};
// Old plans stored wu/cd once per day; migrate that onto the first session so
// existing data still shows up after the move to per-session wu/cd.
const applyLegacyDayWuCd = (sessions,legacyWu,legacyCd) => {
  if(!(legacyWu||legacyCd)||sessions.length===0) return sessions;
  const [first,...rest]=sessions;
  return [{...first,wu:first.wu||legacyWu,cd:first.cd||legacyCd},...rest];
};
const normalizeDay = d => {
  if(!d||typeof d!=="object") return newDay(true,[]);
  const legacyWu=d.wu||"", legacyCd=d.cd||"";
  // explicit rest
  if(d.restDay===true||(Array.isArray(d.sessions)&&d.sessions.length===0&&d.restDay!==false)) return newDay(true,[]);
  // old format: type directly on day
  if(d.type==="rest") return newDay(true,[]);
  if(d.type) return { restDay:false, sessions:applyLegacyDayWuCd([{parts:[normalizePart(d)],wu:"",cd:""}],legacyWu,legacyCd) };
  // new format: has sessions array
  if(Array.isArray(d.sessions)) {
    if(d.sessions.length===0) return newDay(true,[]);
    return { restDay:false, sessions:applyLegacyDayWuCd(d.sessions.map(normalizeSess),legacyWu,legacyCd) };
  }
  return newDay(true,[]);
};
const migratePlan = plan => {
  if(!plan||typeof plan!=="object") return {};
  const r={};
  DAYS.forEach(day=>{ r[day]=normalizeDay(plan[day]); });
  return r;
};

// Robustly get hillRows from a part in any storage format
const getHillRows = part => {
  if(!part) return [];
  const hr = part.hillRows;
  if(!hr) return [];
  if(Array.isArray(hr)) return hr;
  if(typeof hr==="object") return Object.values(hr);
  return [];
};
const hillRowsSummary = part => {
  const rows = getHillRows(part).filter(r=>parseFloat(r.reps)>0);
  if(!rows.length) return null;
  return rows.map(r=>{
    const sets=parseFloat(r.sets)||1, reps=parseFloat(r.reps)||0, dist=parseFloat(r.distM)||0;
    return (sets>1?sets+"×":"")+reps+"×"+dist+"m";
  }).join(" + ")+" · "+parseFloat(part.distance||0).toFixed(3)+" km";
};

// Structured interval rows for fartlek/interval parts (e.g. "3×6min In" + "2×4min Out"),
// used to build a real Garmin structured workout instead of just free-text notes.
const getWktRows = part => {
  if(!part) return [];
  const wr = part.wktRows;
  if(!wr) return [];
  if(Array.isArray(wr)) return wr;
  if(typeof wr==="object") return Object.values(wr);
  return [];
};
// Each row is {label, mode:"time"|"distance", value, reps}. "alternate" interleaves rows
// round-robin (in,out,in,out,in for 3×in/2×out — a fartlek/speed-game feel); "sequential"
// plays each row's reps back-to-back in list order (a progression/ladder feel). Rows can
// mix time- and distance-based steps freely.
const wktValidRows = rows => rows.filter(r=>(parseFloat(r.value)||0)>0 && (parseInt(r.reps)||0)>0);
const wktRowToStep = r => r.mode==="distance"
  ? {label:(r.label||"").trim(), durationType:"distance", meters:(parseFloat(r.value)||0)*1000}
  : {label:(r.label||"").trim(), durationType:"time", minutes:parseFloat(r.value)||0};
const expandWktRows = (rows, pattern="alternate") => {
  const valid = wktValidRows(rows);
  if(pattern==="sequential"){
    const steps=[];
    valid.forEach(r=>{ for(let i=0;i<(parseInt(r.reps)||0);i++) steps.push(wktRowToStep(r)); });
    return steps;
  }
  const pools = valid.map(r=>({...r, remaining:parseInt(r.reps)||0}));
  const steps=[];
  let progress=true;
  while(progress){
    progress=false;
    for(const p of pools){
      if(p.remaining>0){ steps.push(wktRowToStep(p)); p.remaining--; progress=true; }
    }
  }
  return steps;
};
// One-line read-only summary of the structured rows, e.g. "3×6min In / 2×4min Out · 26 min total".
const wktRowsSummary = part => {
  const pattern = part.wktPattern==="sequential"?"sequential":"alternate";
  const expanded = expandWktRows(getWktRows(part), pattern);
  if(!expanded.length) return null;
  const rows = wktValidRows(getWktRows(part));
  const totalMin = expanded.reduce((t,s)=>t+(s.durationType==="time"?s.minutes:0),0);
  const totalKm = expanded.reduce((t,s)=>t+(s.durationType==="distance"?s.meters/1000:0),0);
  const joiner = pattern==="sequential" ? " → " : " / ";
  const label = r=>parseInt(r.reps)+"×"+parseFloat(r.value)+(r.mode==="distance"?"km":"min")+" "+((r.label||"").trim()||"Stage");
  const totals = [totalMin>0?totalMin+" min":null, totalKm>0?totalKm.toFixed(1)+" km":null].filter(Boolean).join(" + ");
  return rows.map(label).join(joiner)+(totals?" · "+totals+" total":"");
};


// ── Small UI components ───────────────────────────────────────────────────────
const Avatar = ({name,level,size=38}) => {
  const c=LVL[level]||LVL.recreational;
  return h("div",{style:{width:size,height:size,borderRadius:"50%",flexShrink:0,background:c.bg,color:c.color,border:`1.5px solid ${c.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size>40?15:12,fontWeight:700}},initials(name));
};
const StatCard = ({label,value,accent}) =>
  h("div",{className:"sc"},h("div",{className:"sl"},label),h("div",{className:"sv",style:{color:accent||"var(--text)"}},value));
const Toast = ({msg,ok}) =>

// ── Part Editor ───────────────────────────────────────────────────────────────
const HillPlanRows = ({part, onChange}) => {
  const rows = getHillRows(part).length > 0 ? getHillRows(part) : [{sets:"",reps:"",distM:""}];
  const update = (i,k,v) => {
    const nr=[...rows]; nr[i]={...nr[i],[k]:v};
    const totalKm=nr.reduce((t,r)=>{
      const sets=parseFloat(r.sets)||1, reps=parseFloat(r.reps)||0, dist=parseFloat(r.distM)||0;
      return t+(sets*reps*dist/1000);
    },0);
    onChange({...part, hillRows:nr, distance:totalKm.toFixed(3)});
  };
  const addRow = () => onChange({...part, hillRows:[...rows,{sets:"",reps:"",distM:""}]});
  const removeRow = i => {
    const nr=rows.filter((_,idx)=>idx!==i);
    const totalKm=nr.reduce((t,r)=>{
      const sets=parseFloat(r.sets)||1, reps=parseFloat(r.reps)||0, dist=parseFloat(r.distM)||0;
      return t+(sets*reps*dist/1000);
    },0);
    onChange({...part, hillRows:nr, distance:totalKm.toFixed(3)});
  };
  const totalKm=rows.reduce((t,r)=>{
    const sets=parseFloat(r.sets)||1, reps=parseFloat(r.reps)||0, dist=parseFloat(r.distM)||0;
    return t+(sets*reps*dist/1000);
  },0);
  return h("div",{style:{marginTop:6}},
    h("div",{style:{display:"grid",gridTemplateColumns:"70px 70px 70px 1fr 20px",gap:5,marginBottom:4,alignItems:"center"}},
      h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"Sets"),
      h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"Reps"),
      h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"Dist (m)"),
      h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"= km"),
      h("div")
    ),
    rows.map((row,i)=>{
      const sets=parseFloat(row.sets)||1, reps=parseFloat(row.reps)||0, dist=parseFloat(row.distM)||0;
      const rowKm=(sets*reps*dist/1000);
      return h("div",{key:i,style:{display:"grid",gridTemplateColumns:"70px 70px 70px 1fr 20px",gap:5,marginBottom:5,alignItems:"center"}},
        h("input",{type:"number",value:row.sets,onChange:e=>update(i,"sets",e.target.value),placeholder:"2",style:{padding:"4px 6px",fontSize:12,fontFamily:"'DM Mono',monospace"}}),
        h("input",{type:"number",value:row.reps,onChange:e=>update(i,"reps",e.target.value),placeholder:"4",style:{padding:"4px 6px",fontSize:12,fontFamily:"'DM Mono',monospace"}}),
        h("input",{type:"number",value:row.distM,onChange:e=>update(i,"distM",e.target.value),placeholder:"120",style:{padding:"4px 6px",fontSize:12,fontFamily:"'DM Mono',monospace"}}),
        h("div",{style:{fontSize:11,color:"var(--text)",fontFamily:"monospace",paddingLeft:4}}, rowKm>0?rowKm.toFixed(3)+" km":"—"),
        rows.length>1?h("button",{onClick:()=>removeRow(i),style:{border:"none",background:"none",cursor:"pointer",color:"var(--danger)",fontSize:14,lineHeight:1,padding:0}},"×"):h("div")
      );
    }),
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:4}},
      h("button",{onClick:addRow,className:"btn btns",style:{fontSize:11}},"+ Add row"),
      totalKm>0&&h("span",{style:{fontSize:11,fontWeight:700,color:"var(--text)",fontFamily:"monospace"}},"Total: "+totalKm.toFixed(3)+" km")
    )
  );
};

// Structured stage rows for fartlek/interval/long parts — feeds both the plan display and
// the Garmin .fit export (see expandWktRows / sessionToFitSteps below). Each row can be
// timed in minutes or km, repeated N times, and either interleaved with its sibling rows
// (a fartlek/speed-game feel) or played through in order (a progression/ladder feel).
const WKT_PATTERNS = [["alternate","Alternating"],["sequential","In order"]];
const WktRows = ({part, onChange}) => {
  const [defLabelA,defLabelB] = (part.type==="fartlek"||part.type==="interval") ? ["In","Out"]
    : (part.type==="long"||part.type==="tempo"||part.type==="race") ? ["Fast","Steady"]
    : ["Work","Rest"];
  const rows = getWktRows(part).length > 0 ? getWktRows(part) : [{label:defLabelA,mode:"time",value:"",reps:""},{label:defLabelB,mode:"time",value:"",reps:""}];
  const pattern = part.wktPattern==="sequential" ? "sequential" : "alternate";
  const update = (i,k,v) => onChange({...part, wktRows:rows.map((r,idx)=>idx===i?{...r,[k]:v}:r)});
  const addRow = () => onChange({...part, wktRows:[...rows,{label:"",mode:"time",value:"",reps:""}]});
  const removeRow = i => onChange({...part, wktRows:rows.filter((_,idx)=>idx!==i)});
  const expanded = expandWktRows(rows, pattern);
  const totalMin = expanded.reduce((t,s)=>t+(s.durationType==="time"?s.minutes:0),0);
  const totalKm = expanded.reduce((t,s)=>t+(s.durationType==="distance"?s.meters/1000:0),0);
  return h("div",{style:{marginTop:6}},
    h("div",{style:{display:"flex",gap:6,marginBottom:8}},
      WKT_PATTERNS.map(([k,label])=>h("button",{key:k,onClick:()=>onChange({...part,wktPattern:k}),style:{padding:"3px 9px",fontSize:11,fontWeight:600,borderRadius:4,cursor:"pointer",
        border:pattern===k?"1.5px solid var(--accent)":"0.5px solid var(--border-strong)",
        background:pattern===k?"var(--warning-bg)":"var(--surface)",
        color:pattern===k?"var(--warning-text)":"var(--text-muted)"
      }},label))
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 55px 85px 55px 20px",gap:5,marginBottom:4,alignItems:"center"}},
      h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"Label"),
      h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"Value"),
      h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"Unit"),
      h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"× Reps"),
      h("div")
    ),
    rows.map((row,i)=>h("div",{key:i,style:{display:"grid",gridTemplateColumns:"1fr 55px 85px 55px 20px",gap:5,marginBottom:5,alignItems:"center"}},
      h("input",{value:row.label||"",onChange:e=>update(i,"label",e.target.value),placeholder:i%2===0?defLabelA:defLabelB,style:{padding:"4px 6px",fontSize:12}}),
      h("input",{type:"number",value:row.value||"",onChange:e=>update(i,"value",e.target.value),placeholder:row.mode==="distance"?"1.5":"6",style:{padding:"4px 6px",fontSize:12,fontFamily:"'DM Mono',monospace"}}),
      h("div",{style:{display:"flex",borderRadius:4,overflow:"hidden",border:"0.5px solid var(--border-strong)"}},
        h("button",{onClick:()=>update(i,"mode","time"),style:{flex:1,padding:"3px 0",fontSize:11,fontWeight:600,border:"none",cursor:"pointer",background:row.mode!=="distance"?"var(--accent)":"var(--surface)",color:row.mode!=="distance"?"var(--accent-text)":"var(--text-muted)"}},"min"),
        h("button",{onClick:()=>update(i,"mode","distance"),style:{flex:1,padding:"3px 0",fontSize:11,fontWeight:600,border:"none",cursor:"pointer",background:row.mode==="distance"?"var(--accent)":"var(--surface)",color:row.mode==="distance"?"var(--accent-text)":"var(--text-muted)"}},"km")
      ),
      h("input",{type:"number",value:row.reps||"",onChange:e=>update(i,"reps",e.target.value),placeholder:"1",style:{padding:"4px 6px",fontSize:12,fontFamily:"'DM Mono',monospace"}}),
      rows.length>1?h("button",{onClick:()=>removeRow(i),style:{border:"none",background:"none",cursor:"pointer",color:"var(--danger)",fontSize:14,lineHeight:1,padding:0}},"×"):h("div")
    )),
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:4}},
      h("button",{onClick:addRow,className:"btn btns",style:{fontSize:11}},"+ Add row"),
      (totalMin>0||totalKm>0)&&h("span",{style:{fontSize:11,fontWeight:700,color:"var(--text)",fontFamily:"monospace"}},
        expanded.length+" steps"+(totalMin>0?" · "+totalMin+" min":"")+(totalKm>0?" · "+totalKm.toFixed(1)+" km":"")
      )
    )
  );
};

              )

// ── Plan Editor ───────────────────────────────────────────────────────────────
const PlanEditor = ({plan,onSave,onCancel,groupName}) => {
  const [local,setLocal]=useState(()=>{
    const p={};
    DAYS.forEach(day=>{
      const d=plan[day];
      if(!d){p[day]=newDay(true,[]);return;}
      p[day]={...d,sessions:(d.sessions||[]).map(s=>({...s,parts:(s.parts||[]).map(pp=>({...pp}))}))};
    });
    return p;
  });
  const toggleRest=day=>setLocal(p=>({...p,[day]:{...p[day],restDay:!p[day].restDay,sessions:p[day].restDay?[newSess()]:[]}}));
  const addSess   =day=>setLocal(p=>({...p,[day]:{...p[day],sessions:[...p[day].sessions,newSess()]}}));
  const updSess   =(day,i,s)=>setLocal(p=>{const ss=[...p[day].sessions];ss[i]=s;return{...p,[day]:{...p[day],sessions:ss}};});
  const remSess   =(day,i)=>setLocal(p=>{const ss=p[day].sessions.filter((_,idx)=>idx!==i);return{...p,[day]:{...p[day],sessions:ss}};});
  const totalKm=DAYS.reduce((s,d)=>s+dayTotalKm(local[d]),0);
  return h("div",null,
    groupName&&h("div",{style:{marginBottom:12,padding:"8px 12px",background:"var(--warning-bg)",borderRadius:8,fontSize:13,color:"var(--warning-text)",fontWeight:500}},"📋 Group plan for: "+groupName),
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,padding:"10px 14px",background:"var(--surface-alt)",borderRadius:8}},
      h("span",{style:{fontSize:13,color:"var(--text-muted2)"}},"Weekly volume"),
      h("span",{className:"mono",style:{fontSize:18,fontWeight:700}},"Total volume: "+Math.round(totalKm)+" km")
    ),
    DAYS.map(day=>{
      const d=local[day],isRest=d.restDay||d.sessions.length===0;
      return h("div",{key:day,style:{border:"0.5px solid var(--border)",borderRadius:10,padding:"12px 14px",marginBottom:8,background:isRest?"var(--surface-alt)":"var(--surface)"}},
        h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:isRest?0:10}},
          h("div",{style:{fontSize:11,fontWeight:700,color:"var(--text-muted)",width:28,textTransform:"uppercase",letterSpacing:"0.06em",flexShrink:0}},day),
          h("label",{style:{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer",userSelect:"none"}},
            h("input",{type:"checkbox",checked:!isRest,onChange:()=>toggleRest(day),style:{width:15,height:15,cursor:"pointer",accentColor:"var(--accent)"}}),
            h("span",{style:{color:isRest?"var(--text-muted)":"var(--text)",fontWeight:isRest?400:500}},isRest?"Rest / Off day":"Training day")
          ),
          !isRest&&h("button",{onClick:()=>addSess(day),className:"btn btns",style:{marginLeft:"auto"}},"+  Add session")
        ),
        !isRest&&d.sessions.map((sess,i)=>h(SessionEditor,{key:i,session:sess,index:i,total:d.sessions.length,onChange:s=>updSess(day,i,s),onRemove:()=>remSess(day,i)}))
      );
    }),
    h("div",{style:{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}},
      h("button",{className:"btn",onClick:onCancel},"Cancel"),
      h("button",{className:"btnp",onClick:()=>onSave(local)},"Save plan")
    )
  );
};

// ── Athlete Form ──────────────────────────────────────────────────────────────
const AthleteForm = ({initial,groups,onSave,onCancel}) => {
  const blank={name:"",level:"recreational",age:"",pb5k:"",pb10k:"",pbHalf:"",pbMarathon:"",events:"",notes:"",groupId:"",email:"",password:""};

// ── Garmin TCX import ────────────────────────────────────────────────────────
// Client-side only: athletes export "Export TCX" from a Garmin Connect activity
// page and upload the file here. Parsed with the browser's built-in DOMParser —
// no library, no server round-trip.
const formatPaceFromSecPerKm = (secPerKm) => {
  if (!secPerKm || !isFinite(secPerKm) || secPerKm<=0) return "";
  const m=Math.floor(secPerKm/60), sec=Math.round(secPerKm%60);
  return m+":"+String(sec).padStart(2,"0");
};
// decimals=0 gives "mm:ss" (or "h:mm:ss"); decimals=1 gives "mm:ss.s" — pass 1 for
// rep/lap-level times, where a coach analyzing short reps cares about tenths of a second.
const formatHms = (totalSec, decimals=0) => {
  const factor = Math.pow(10,decimals);
  totalSec = Math.round(Math.max(0,totalSec||0)*factor)/factor;
  const hh = Math.floor(totalSec/3600);
  const mm = Math.floor((totalSec-hh*3600)/60);
  const ss = totalSec-hh*3600-mm*60;
  const ssStr = ss.toFixed(decimals).padStart(decimals>0?3+decimals:2,"0");
  return (hh>0?hh+":":"")+(hh>0?String(mm).padStart(2,"0"):String(mm))+":"+ssStr;
};
// Parses "mm:ss" or "h:mm:ss" text (incl. hand-edited values) back to seconds.
const parseMmss = (str) => {
  if (!str) return 0;
  const parts = String(str).split(":").map(x=>parseFloat(x)||0);
  if (parts.length===3) return parts[0]*3600+parts[1]*60+parts[2];
  if (parts.length===2) return parts[0]*60+parts[1];
  return parts[0]||0;
};
// Formats a saved lap-analyzer group ({count,totalDist,totalTime,avgPace,avgHr,avgTimePerLap}) as one summary line.
const formatGroupStats = g => g.count+" lap"+(g.count!==1?"s":"")+" · "+(g.totalDist/1000).toFixed(3)+" km · "+formatHms(g.totalTime,1)+" total"+
  (g.avgPace?" · "+g.avgPace+"/km avg":"")+(g.avgHr?" · "+g.avgHr+" bpm avg":"")+" · "+formatHms(g.avgTimePerLap,1)+" avg/lap";
const parseTcxFile = (xmlText) => {
  const doc = new DOMParser().parseFromString(xmlText,"application/xml");
  if (doc.getElementsByTagName("parsererror").length) return null;
  const laps = Array.from(doc.getElementsByTagName("Lap"));
  if (!laps.length) return null;
  let totalTime=0, totalDist=0, hrWeighted=0, hrWeightedTime=0;
  const lapDetails=[];
  laps.forEach(lap=>{
    const t=parseFloat(lap.getElementsByTagName("TotalTimeSeconds")[0]?.textContent||"0")||0;
    const d=parseFloat(lap.getElementsByTagName("DistanceMeters")[0]?.textContent||"0")||0;
    totalTime+=t; totalDist+=d;
    const avgHrEl=lap.getElementsByTagName("AverageHeartRateBpm")[0];
    const v=avgHrEl?(parseFloat(avgHrEl.getElementsByTagName("Value")[0]?.textContent||"0")||0):0;
    lapDetails.push({timeSec:t, distM:d, avgHr:v>0?Math.round(v):null});
    if(v>0){ hrWeighted+=v*t; hrWeightedTime+=t; }
  });
  if (!(totalDist>0)) return null;
  let avgHr=null;
  if (hrWeightedTime>0) avgHr=Math.round(hrWeighted/hrWeightedTime);
  else {
    const tps=Array.from(doc.getElementsByTagName("Trackpoint"));
    let sum=0,count=0;
    tps.forEach(tp=>{
      const hrEl=tp.getElementsByTagName("HeartRateBpm")[0];
      const v=hrEl?(parseFloat(hrEl.getElementsByTagName("Value")[0]?.textContent||"0")||0):0;
      if(v>0){sum+=v;count++;}
    });
    if(count>0) avgHr=Math.round(sum/count);
  }
  const distKm = totalDist/1000;
  const paceSecPerKm = distKm>0 ? totalTime/distKm : 0;
  return {
    distKm,
    totalTimeSec: totalTime,
    pace: formatPaceFromSecPerKm(paceSecPerKm),
    finishTime: formatHms(totalTime,1),
    avgHr,
    laps: lapDetails
  };
};
// Maps an imported activity onto the fields a given session-part type actually shows.
const GARMIN_PACE_FIELD = { tempo:"tempoPace", long:"avgPace", fartlek:"avgPace" };
const garminFillTypeData = (type, existingTypeData, parsed) => {
  const existing = existingTypeData||{};
  if (type==="hills") {
    // Only usable if the athlete lapped their watch per rep — one TCX lap per row.
    // Recovery-jog laps come through too; coach/athlete deletes rows that aren't reps.
    if (!parsed.laps || parsed.laps.length<2) return existing;
    return {
      ...existing,
      hillRows: parsed.laps.map(lap=>({sets:"1", reps:"1", distM:String(Math.round(lap.distM)), avgTime:formatHms(lap.timeSec,1), hr:lap.avgHr||""})),
      actualDistance: parsed.distKm.toFixed(3)
    };
  }
  const base = {...existing, actualDistance: parsed.distKm.toFixed(2)};
  if (type==="race") { base.finishTime = parsed.finishTime; return base; }
  if (type==="interval") return base; // splits stay free-text/manual
  if (type==="strength") return {...existing, duration:String(Math.round(parsed.totalTimeSec/60))};
  base[GARMIN_PACE_FIELD[type]||"actualPace"] = parsed.pace;
  return base;
};

// ── Garmin FIT workout export ───────────────────────────────────────────────────
// Builds a minimal, standards-conformant .fit "workout" file (file_id + workout +
// workout_step messages) entirely client-side, so a coach's prescribed session can be
// downloaded and imported straight into Garmin Connect (Training > Workouts > Import),
// which then syncs it to the athlete's watch like any other structured workout.
// Field numbers/enums verified against Garmin's FIT profile (file_id, workout,
// workout_step) and the CRC-16 algorithm used by the FIT protocol.
const FIT_EPOCH_OFFSET = 631065600; // seconds between Unix epoch and FIT epoch (1989-12-31T00:00:00Z)
const FIT_BASE_TYPE = { enum:0x00, uint16:0x84, uint32:0x86, uint32z:0x8C, string:0x07 };
const FIT_CRC_TABLE = [0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];
const fitCrc16 = bytes => {
  let crc=0;
  for(let i=0;i<bytes.length;i++){
    const b=bytes[i];
    let tmp=FIT_CRC_TABLE[crc&0xF]; crc=((crc>>4)&0x0FFF)^tmp^FIT_CRC_TABLE[b&0xF];
    tmp=FIT_CRC_TABLE[crc&0xF]; crc=((crc>>4)&0x0FFF)^tmp^FIT_CRC_TABLE[(b>>4)&0xF];
  }
  return crc&0xFFFF;
};
class FitWriter {
  constructor(){ this.bytes=[]; }
  u8(v){ this.bytes.push(v&0xFF); }
  u16(v){ this.u8(v); this.u8(v>>8); }
  u32(v){ this.u8(v); this.u8(v>>8); this.u8(v>>16); this.u8(v>>>24); }
  // Always leaves at least one trailing 0x00 so the field is null-terminated even at max length.
  str(s,len){ const enc=new TextEncoder().encode(String(s||"")).slice(0,len-1); for(let i=0;i<len;i++) this.u8(i<enc.length?enc[i]:0); }
}
// steps: [{label, durationType:"time"|"distance"|"open", minutes, meters}]
const encodeFitWorkout = (name, steps) => {
  const NAME_LEN=20, STEP_NAME_LEN=16;
  const w=new FitWriter();
  // file_id (local msg 0)
  w.u8(0x40); w.u8(0); w.u8(0); w.u16(0); w.u8(5);
  w.u8(0); w.u8(1); w.u8(FIT_BASE_TYPE.enum);    // type
  w.u8(1); w.u8(2); w.u8(FIT_BASE_TYPE.uint16);  // manufacturer
  w.u8(2); w.u8(2); w.u8(FIT_BASE_TYPE.uint16);  // product
  w.u8(3); w.u8(4); w.u8(FIT_BASE_TYPE.uint32z); // serial_number
  w.u8(4); w.u8(4); w.u8(FIT_BASE_TYPE.uint32);  // time_created
  w.u8(0x00);
  w.u8(5);   // type = workout
  w.u16(255); // manufacturer = development
  w.u16(0);   // product
  w.u32(1);   // serial_number
  w.u32(Math.floor(Date.now()/1000)-FIT_EPOCH_OFFSET);
  // workout (local msg 1)
  w.u8(0x41); w.u8(0); w.u8(0); w.u16(26); w.u8(3);
  w.u8(4); w.u8(1); w.u8(FIT_BASE_TYPE.enum);        // sport
  w.u8(6); w.u8(2); w.u8(FIT_BASE_TYPE.uint16);       // num_valid_steps
  w.u8(8); w.u8(NAME_LEN); w.u8(FIT_BASE_TYPE.string); // wkt_name
  w.u8(0x01);
  w.u8(1); // sport = running
  w.u16(steps.length);
  w.str(name,NAME_LEN);
  // workout_step (local msg 2) — definition written once, reused for every step below
  w.u8(0x42); w.u8(0); w.u8(0); w.u16(27); w.u8(7);
  w.u8(254); w.u8(2); w.u8(FIT_BASE_TYPE.uint16);            // message_index
  w.u8(0); w.u8(STEP_NAME_LEN); w.u8(FIT_BASE_TYPE.string);  // wkt_step_name
  w.u8(1); w.u8(1); w.u8(FIT_BASE_TYPE.enum);                // duration_type
  w.u8(2); w.u8(4); w.u8(FIT_BASE_TYPE.uint32);               // duration_value
  w.u8(3); w.u8(1); w.u8(FIT_BASE_TYPE.enum);                // target_type
  w.u8(4); w.u8(4); w.u8(FIT_BASE_TYPE.uint32);               // target_value
  w.u8(7); w.u8(1); w.u8(FIT_BASE_TYPE.enum);                // intensity
  steps.forEach((step,i)=>{
    w.u8(0x02);
    w.u16(i);
    w.str(step.label,STEP_NAME_LEN);
    if(step.durationType==="time"){ w.u8(0); w.u32(Math.round(step.minutes*60*1000)); }
    else if(step.durationType==="distance"){ w.u8(1); w.u32(Math.round(step.meters*100)); }
    else { w.u8(5); w.u32(0); } // open — athlete presses lap to advance
    w.u8(2); w.u32(0); // target_type = open, no target value
    w.u8(0); // intensity = active — the step name/label is what actually guides the athlete
  });
  const dataBytes=w.bytes;
  const header=new FitWriter();
  header.u8(14); header.u8(0x10); header.u16(2167); header.u32(dataBytes.length);
  header.u8(0x2E); header.u8(0x46); header.u8(0x49); header.u8(0x54); // ".FIT"
  header.u16(fitCrc16(header.bytes));
  const fileBytes=header.bytes.concat(dataBytes);
  const fileCrc=fitCrc16(fileBytes);
  fileBytes.push(fileCrc&0xFF,(fileCrc>>8)&0xFF);
  return new Uint8Array(fileBytes);
};
// Builds one workout_step per plan part — expanding rep-group rows (any type except hills,
// which has its own distance-rep structure) into their alternating or sequential steps, and
// a single time/distance/open step for anything without rows. Warm-up and cool-down km are
// deliberately left out of the export: they're run before/after the watch workout, not part of it.
const partToFitStep = part => {
  const wt=WT[part.type]||WT.easy;
  const wktRows=wktValidRows(getWktRows(part));
  if(part.type!=="hills"&&wktRows.length>0) return expandWktRows(wktRows, part.wktPattern==="sequential"?"sequential":"alternate");
  const label=(part.notes||wt.label).slice(0,15);
  if(part.type==="hills"){
    const dist=parseFloat(part.distance)||0;
    return [dist>0?{label,durationType:"distance",meters:dist*1000}:{label,durationType:"open"}];
  }
  if(part.mode==="time"&&parseFloat(part.duration)>0) return [{label,durationType:"time",minutes:parseFloat(part.duration)}];
  if(part.mode!=="time"&&parseFloat(part.distance)>0) return [{label,durationType:"distance",meters:parseFloat(part.distance)*1000}];
  return [{label,durationType:"open"}];
};
const sessionToFitSteps = session => {
  const steps=[];
  (session.parts||[]).forEach(part=>{ steps.push(...partToFitStep(part)); });
  return steps;
};
const downloadFitWorkout = (filename, bytes) => {
  const blob=new Blob([bytes],{type:"application/octet-stream"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

      s("hillRows",nr);
      const totalKm=nr.reduce((t,r)=>{
        const sets=parseFloat(r.sets)||1, reps=parseFloat(r.reps)||0, dist=parseFloat(r.distM)||0;
        return t+(sets*reps*dist/1000);
      },0);
      s("actualDistance",totalKm.toFixed(3));
    };
    const addRow = () => { const nr=[...rows,{sets:"",reps:"",distM:""}]; setRows(nr); s("hillRows",nr); };
    const removeRow = i => {
      const nr=rows.filter((_,idx)=>idx!==i);
      setRows(nr);
      s("hillRows",nr);
      const totalKm=nr.reduce((t,r)=>{
        const sets=parseFloat(r.sets)||1, reps=parseFloat(r.reps)||0, dist=parseFloat(r.distM)||0;
        return t+(sets*reps*dist/1000);
      },0);
      s("actualDistance",totalKm.toFixed(3));
    };
    const totalHillKm=rows.reduce((t,r)=>{
      const sets=parseFloat(r.sets)||1, reps=parseFloat(r.reps)||0, dist=parseFloat(r.distM)||0;
      return t+(sets*reps*dist/1000);
    },0);
    // Averages recompute live from whatever rows remain — e.g. after deleting recovery-jog rows.
    const timedRows = rows.filter(r=>parseMmss(r.avgTime)>0 && (parseFloat(r.distM)||0)>0);
    const repCount = timedRows.reduce((t,r)=>t+(parseFloat(r.sets)||1)*(parseFloat(r.reps)||1),0);
    const totalTimedSec = timedRows.reduce((t,r)=>t+parseMmss(r.avgTime)*(parseFloat(r.sets)||1)*(parseFloat(r.reps)||1),0);
    const totalTimedM = timedRows.reduce((t,r)=>t+(parseFloat(r.distM)||0)*(parseFloat(r.sets)||1)*(parseFloat(r.reps)||1),0);
    const avgRepTimeSec = repCount>0 ? totalTimedSec/repCount : 0;
    const avgRepPace = totalTimedM>0 ? formatPaceFromSecPerKm(totalTimedSec/(totalTimedM/1000)) : "";
    const hrRows = rows.filter(r=>parseFloat(r.hr)>0);
    const avgRepHr = hrRows.length ? Math.round(hrRows.reduce((t,r)=>t+parseFloat(r.hr),0)/hrRows.length) : null;
    return h("div",{style:{marginBottom:8}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"var(--text-muted2)",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}},"Hill sets"),
      h("div",{style:{display:"grid",gridTemplateColumns:"64px 64px 70px 70px 1fr 24px",gap:6,marginBottom:4,alignItems:"center"}},
        h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"Sets"),
        h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"Reps"),
        h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"Dist (m)"),
        h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"Avg time"),
        h("div",{style:{fontSize:10,color:"var(--text-muted)",fontWeight:600}},"= km"),
        h("div")
      ),
      rows.map((row,i)=>{
        const sets=parseFloat(row.sets)||1, reps=parseFloat(row.reps)||0, dist=parseFloat(row.distM)||0;
        const rowKm=(sets*reps*dist/1000);
        const rowTimeSec=parseMmss(row.avgTime);
        const rowPace = (rowTimeSec>0 && dist>0) ? formatPaceFromSecPerKm(rowTimeSec/(dist/1000)) : "";
        return h("div",{key:i,style:{display:"grid",gridTemplateColumns:"64px 64px 70px 70px 1fr 24px",gap:6,marginBottom:6,alignItems:"center"}},
          h("input",{type:"number",value:row.sets,onChange:e=>updateRow(i,"sets",e.target.value),placeholder:"2",className:"mono",style:{padding:"5px 7px",fontSize:13}}),
          h("input",{type:"number",value:row.reps,onChange:e=>updateRow(i,"reps",e.target.value),placeholder:"4",className:"mono",style:{padding:"5px 7px",fontSize:13}}),
          h("input",{type:"number",value:row.distM,onChange:e=>updateRow(i,"distM",e.target.value),placeholder:"120",className:"mono",style:{padding:"5px 7px",fontSize:13}}),
          h("input",{value:row.avgTime||"",onChange:e=>updateRow(i,"avgTime",e.target.value),placeholder:"0:38",className:"mono",style:{padding:"5px 7px",fontSize:13}}),
          h("div",{style:{fontSize:12,color:"var(--text)",fontFamily:"monospace",padding:"0 4px",lineHeight:1.3}},
            rowKm>0 ? rowKm.toFixed(3)+" km" : "—",
            (rowPace||row.hr)&&h("div",{style:{fontSize:10,color:"var(--text-muted)"}},[rowPace&&rowPace+"/km",row.hr&&row.hr+" bpm"].filter(Boolean).join(" · "))
          ),
          rows.length>1
            ? h("button",{onClick:()=>removeRow(i),style:{border:"none",background:"none",cursor:"pointer",color:"var(--danger)",fontSize:16,lineHeight:1,padding:0}},"×")
            : h("div")
        );
      }),
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:4,flexWrap:"wrap",gap:6}},
        h("button",{onClick:addRow,className:"btn btns",style:{fontSize:11}},"+ Add row"),
        totalHillKm>0&&h("div",{style:{fontSize:13,fontWeight:700,color:"var(--text)"}},
          "Total hill distance: ",h("span",{className:"mono"},totalHillKm.toFixed(3)," km")
        )
      ),
      avgRepTimeSec>0&&h("div",{style:{marginTop:8,padding:"8px 10px",background:"var(--info-bg)",borderRadius:6,border:"0.5px solid var(--border-strong)",fontSize:12,color:"var(--info-text)"}},
        "Avg per rep (",repCount," rep"+(repCount!==1?"s":""),"): ",
        h("strong",null,formatHms(avgRepTimeSec,1)),
        avgRepPace&&h("span",null," · "+avgRepPace+"/km"),
        avgRepHr&&h("span",null," · "+avgRepHr+" bpm avg HR")
      )
    );
  }

  if (type==="strength") return h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}},
    h("div",null,h("label",{className:"lbl"},"Duration (minutes)"),h("input",{type:"number",value:f.duration||"",onChange:e=>s("duration",e.target.value),placeholder:"e.g. 45"})),
    h("div",null,h("label",{className:"lbl"},"Actual distance (km) — optional"),h("input",{type:"number",value:f.actualDistance||"",onChange:e=>s("actualDistance",e.target.value),placeholder:"0",className:"mono"}))
  );

  if (type==="race") return h("div",{style:{marginBottom:8}},
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}},
      h("div",null,h("label",{className:"lbl"},"Finish time (hh:mm:ss)"),h("input",{value:f.finishTime||"",onChange:e=>s("finishTime",e.target.value),placeholder:"e.g. 1:23:45",className:"mono"})),
      h("div",null,h("label",{className:"lbl"},"Official distance (km)"),h("input",{type:"number",value:f.actualDistance||"",onChange:e=>s("actualDistance",e.target.value),placeholder:"e.g. 10",className:"mono"}))
    ),
    h("div",null,
      h("label",{className:"lbl"},"Splits (write freely)"),
      h("textarea",{value:f.splits||"",onChange:e=>s("splits",e.target.value),rows:3,placeholder:"e.g. 5km: 22:30 | 10km: 45:10 | 15km: 1:08:20"})
    )
  );

  // Default fallback
  return h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}},
    h(ActualDistanceField,{f,s,planPart}),
    h("div",null,h("label",{className:"lbl"},"Actual pace (mm:ss)"),h("input",{value:f.actualPace||"",onChange:e=>s("actualPace",e.target.value),placeholder:"e.g. 5:00",className:"mono"}))
  );
};

// Standalone Garmin lap browser: shows every lap in a file (WU, reps, recovery, CD —
// everything), lets you check any subset and pin its average as a labeled group,
// then check a different subset and pin another. Saved groups are controlled by the
// parent (persisted into the report) so they're still visible after this closes.
const LapAnalyzer = ({onClose, groups, onGroupsChange}) => {
  const [laps, setLaps] = useState(null);
  const [checked, setChecked] = useState({});
  const [error, setError] = useState(null);
  const [labelDraft, setLabelDraft] = useState("");

  const handleFile = (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const parsed = parseTcxFile(reader.result);
      if (!parsed || !parsed.laps || !parsed.laps.length) {
        setError("Couldn't read that file — make sure it's a .tcx export from a Garmin Connect activity.");
        return;
      }
      setError(null);
      setLaps(parsed.laps);
      setChecked({});
    };
    reader.readAsText(file);
  };

  const toggle = i => setChecked(c=>({...c,[i]:!c[i]}));
  const selectedIdx = laps ? laps.map((_,i)=>i).filter(i=>checked[i]) : [];

  const computeStats = idxList => {
    const sel = idxList.map(i=>laps[i]);
    const totalTime = sel.reduce((s,l)=>s+l.timeSec,0);
    const totalDist = sel.reduce((s,l)=>s+l.distM,0);
    const hrVals = sel.filter(l=>l.avgHr).map(l=>l.avgHr);
    const avgHr = hrVals.length ? Math.round(hrVals.reduce((s,v)=>s+v,0)/hrVals.length) : null;
    const avgPace = totalDist>0 ? formatPaceFromSecPerKm(totalTime/(totalDist/1000)) : "";
    const avgTimePerLap = sel.length ? totalTime/sel.length : 0;
    return { count: sel.length, totalDist, totalTime, avgPace, avgHr, avgTimePerLap };
  };
  const liveStats = selectedIdx.length ? computeStats(selectedIdx) : null;

  const saveGroup = () => {
    if (!selectedIdx.length) return;
    const label = labelDraft.trim() || `Group ${groups.length+1}`;
    onGroupsChange([...groups, {label, ...computeStats(selectedIdx)}]);
    setChecked({});
    setLabelDraft("");
  };
  const removeGroup = i => onGroupsChange(groups.filter((_,idx)=>idx!==i));
  const renameGroup = (i,label) => onGroupsChange(groups.map((g,idx)=>idx===i?{...g,label}:g));

  return h(Modal,{title:"Analyze laps", onClose, wide:true},
    !laps && h("div",null,
      h("label",{className:"btn btns",style:{cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6}},
        "📥 Choose .tcx file",
        h("input",{type:"file",accept:".tcx,.xml",onChange:handleFile,style:{display:"none"}})
      ),
      error&&h("div",{style:{marginTop:10,fontSize:12,color:"var(--danger)"}},error)
    ),
    laps&&h("div",null,
      h("div",{style:{fontSize:12,color:"var(--text-muted)",marginBottom:10}},
        laps.length+" laps found. Check the ones you want (e.g. just the uphill reps), label them, and save. Then check a different set (e.g. the recovery jogs) and save again."
      ),
      h("div",{style:{maxHeight:280,overflowY:"auto",border:"0.5px solid var(--border)",borderRadius:8,marginBottom:10}},
        h("div",{style:{display:"grid",gridTemplateColumns:"28px 46px 1fr 1fr 1fr 90px",gap:6,padding:"6px 10px",fontSize:10,fontWeight:700,color:"var(--text-muted)",borderBottom:"0.5px solid var(--border)",position:"sticky",top:0,background:"var(--surface)"}},
          h("div"), h("div",null,"#"), h("div",null,"Distance"), h("div",null,"Time"), h("div",null,"Pace"), h("div",null,"Avg HR")
        ),
        laps.map((lap,i)=>{
          const pace = lap.distM>0 ? formatPaceFromSecPerKm(lap.timeSec/(lap.distM/1000)) : "";
          return h("div",{key:i, onClick:()=>toggle(i), style:{display:"grid",gridTemplateColumns:"28px 46px 1fr 1fr 1fr 90px",gap:6,padding:"6px 10px",fontSize:12,alignItems:"center",cursor:"pointer",background:checked[i]?"var(--info-bg)":"transparent",borderBottom:"0.5px solid var(--border)"}},
            h("input",{type:"checkbox",checked:!!checked[i],onChange:()=>toggle(i),onClick:e=>e.stopPropagation()}),
            h("div",null,i+1),
            h("div",{className:"mono"},(lap.distM/1000).toFixed(3)+" km"),
            h("div",{className:"mono"},formatHms(lap.timeSec,1)),
            h("div",{className:"mono"},pace?pace+"/km":"—"),
            h("div",{className:"mono"},lap.avgHr?lap.avgHr+" bpm":"—")
          );
        })
      ),
      h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}},
        h("div",{style:{fontSize:12,color:"var(--text-muted)"}},selectedIdx.length+" selected"),
        liveStats&&h("div",{style:{fontSize:12,color:"var(--text)"}},
          (liveStats.totalDist/1000).toFixed(3)+" km · "+formatHms(liveStats.totalTime,1)+
          (liveStats.avgPace?" · "+liveStats.avgPace+"/km":"")+(liveStats.avgHr?" · "+liveStats.avgHr+" bpm":"")
        )
      ),
      h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}},
        h("input",{value:labelDraft,onChange:e=>setLabelDraft(e.target.value),placeholder:"Describe this selection — e.g. Hills, Recovery, Warm-up",style:{flex:1,minWidth:200}}),
        h("button",{className:"btnp",disabled:!selectedIdx.length,onClick:saveGroup,style:{fontSize:12,opacity:selectedIdx.length?1:0.5,flexShrink:0}},"Save as group")
      ),
      groups.length>0&&h("div",null,
        h("div",{style:{fontSize:11,fontWeight:700,color:"var(--text-muted2)",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}},"Saved groups"),
        groups.map((g,i)=>h("div",{key:i,style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"10px 12px",background:"var(--info-bg)",borderRadius:8,border:"0.5px solid var(--border-strong)",marginBottom:8,gap:8}},
          h("div",{style:{flex:1}},
            h("input",{value:g.label,onChange:e=>renameGroup(i,e.target.value),style:{fontWeight:700,fontSize:13,border:"none",background:"transparent",padding:0,marginBottom:4,width:"100%",color:"var(--text)"}}),
            h("div",{style:{fontSize:12,color:"var(--info-text)"}},formatGroupStats(g))
          ),
          h("button",{onClick:()=>removeGroup(i),style:{border:"none",background:"none",cursor:"pointer",color:"var(--danger)",fontSize:18,lineHeight:1,flexShrink:0}},"×")
        ))
      )
    )
  );
};

const SessRepForm = ({session, existing, onChange}) => {
  const parts = session.parts||[{type:"easy",distance:"",pace:""}];
  const wt = WT[sessFirstType(session)]||WT.easy;
  const km = sessTotalKm(session);
  const multiPart = parts.length > 1;

  const initPartReps = parts.map((p,i) => existing?.partReps?.[i]||{typeData:{actualDistance:p.distance||""}});
  const [partReps, setPartReps] = useState(initPartReps);
  const [f, setF] = useState(()=>({status:"done", effort:"6", hr:"", notes:"", wu:"", cd:"", garminGroups:[], ...(existing||{})}));
  const [importNonce, setImportNonce] = useState(0);
  const [importMsg, setImportMsg] = useState(null);
  const [showAnalyzer, setShowAnalyzer] = useState(false);

  const s = (k,v) => { const nx={...f,[k]:v}; setF(nx); emitAll(nx, partReps); };
  const updatePart = (i,v) => { const n=[...partReps]; n[i]=v; setPartReps(n); emitAll(f,n); };
  const emitAll = (ff, pr) => {
    const mainActual = pr.reduce((s,p)=>s+(parseFloat(p.typeData?.actualDistance||p.actualDistance)||0),0);
    const totalActual = (parseFloat(ff.wu)||0) + mainActual + (parseFloat(ff.cd)||0);
    onChange({...ff, partReps:pr, actualDistance:mainActual.toFixed(1), totalKm:totalActual.toFixed(1)});
  };

  const handleGarminFile = (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const parsed = parseTcxFile(reader.result);
      if (!parsed) {
        setImportMsg({ok:false, text:"Couldn't read that file — make sure it's a .tcx export from a Garmin Connect activity."});
        return;
      }
      let newPartReps = partReps;
      if (!multiPart) {
        const td = garminFillTypeData(parts[0]?.type||"easy", partReps[0]?.typeData, parsed);
        newPartReps = [{...partReps[0], typeData:td, actualDistance:td.actualDistance||""}, ...partReps.slice(1)];
      }
      const newF = parsed.avgHr ? {...f, hr:String(parsed.avgHr)} : f;
      setPartReps(newPartReps);
      setF(newF);
      emitAll(newF, newPartReps);
      setImportNonce(n=>n+1);
      const isHills = !multiPart && parts[0]?.type==="hills";
      setImportMsg({ok:true, text: multiPart
        ? `Imported ${parsed.distKm.toFixed(2)} km, avg HR ${parsed.avgHr||"—"} — split distance/pace across the parts below manually.`
        : isHills
          ? (parsed.laps.length>1
              ? `Imported ${parsed.laps.length} laps as hill rows below (one per row) — delete any that aren't reps, e.g. recovery jogs.`
              : `This file has only one lap, so it can't be split into reps — enter hill sets manually below.`)
          : `Imported ${parsed.distKm.toFixed(2)} km @ ${parsed.pace}/km, avg HR ${parsed.avgHr||"—"}.`
      });
    };
    reader.readAsText(file);
  };

  return h("div",{style:{background:"var(--surface-alt)", borderRadius:8, padding:"12px 14px", marginBottom:10, borderLeft:`3px solid ${wt.color}`}},
    h("div",{style:{fontSize:12, fontWeight:700, color:wt.dark, marginBottom:8}},
      wt.label+(km>0?` · Total KMs: ${km.toFixed(1)} km`:"")
    ),
    h("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}},
      h("label",{className:"btn btns",style:{cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6,margin:0}},
        "📥 Import from Garmin (.tcx)",
        h("input",{type:"file",accept:".tcx,.xml",onChange:handleGarminFile,style:{display:"none"}})
      ),
      h("button",{className:"btn btns",onClick:()=>setShowAnalyzer(true),style:{fontSize:12}},"🔍 Analyze all laps"),
      importMsg&&h("span",{style:{fontSize:11,color:importMsg.ok?"var(--success)":"var(--danger)"}},importMsg.text)
    ),
    (f.garminGroups||[]).length>0&&h("div",{style:{marginBottom:10}},
      (f.garminGroups||[]).map((g,i)=>h("div",{key:i,style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"8px 10px",background:"var(--info-bg)",borderRadius:6,border:"0.5px solid var(--border-strong)",marginBottom:6,gap:8}},
        h("div",{style:{flex:1}},
          h("input",{value:g.label,onChange:e=>{const gg=[...f.garminGroups]; gg[i]={...gg[i],label:e.target.value}; s("garminGroups",gg);},placeholder:"Describe this selection",style:{fontWeight:700,fontSize:12,border:"none",background:"transparent",padding:0,marginBottom:2,width:"100%",color:"var(--text)"}}),
          h("div",{style:{fontSize:11,color:"var(--info-text)"}},formatGroupStats(g))
        ),
        h("button",{onClick:()=>s("garminGroups",f.garminGroups.filter((_,idx)=>idx!==i)),style:{border:"none",background:"none",cursor:"pointer",color:"var(--danger)",fontSize:16,lineHeight:1,flexShrink:0}},"×")
      ))
    ),
    h("div",{style:{marginBottom:10,padding:"8px 10px",background:"var(--info-bg)",borderRadius:6,border:"0.5px solid var(--border-strong)"}},
      h("label",{className:"lbl"},"Warm up KMs (run + drills + strides)"),
      h("input",{type:"number",value:f.wu||"",onChange:e=>s("wu",e.target.value),placeholder:"e.g. 3",className:"mono",step:"0.1",style:{maxWidth:120}})
    ),
    h("div",{style:{display:"flex", gap:6, marginBottom:10}},
      Object.entries(SS).map(([st,ss])=>h("button",{key:st, onClick:()=>s("status",st), style:{flex:1,padding:"7px 0",borderRadius:6,cursor:"pointer",fontWeight:600,fontSize:12,border:f.status===st?`2px solid ${ss.border}`:"0.5px solid var(--border)",background:f.status===st?ss.bg:"var(--surface)",color:f.status===st?ss.color:"var(--text-muted)"}},ss.label))
    ),
    f.status!=="skipped"&&h("div",null,
      multiPart
        ? h("div",null,
            h("div",{style:{fontSize:11,fontWeight:700,color:"var(--text-muted2)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.06em"}},"Report per part:"),
            parts.map((part,i)=>h(PartRepForm,{key:i,part,index:i,total:parts.length,existing:partReps[i],onChange:v=>updatePart(i,v)})),
            h("div",{style:{fontSize:12,color:"var(--text-muted)",marginTop:6,marginBottom:8,fontFamily:"'DM Mono',monospace"}},
              "Total actual: ",h("strong",{style:{color:"var(--text)"}},partReps.reduce((s,p)=>s+(parseFloat(p.typeData?.actualDistance||p.actualDistance)||0),0).toFixed(1)+" km")
            )
          )
        : h(TypedRepFields,{key:"tf0-"+importNonce, type:parts[0]?.type||"easy", existing:partReps[0]?.typeData, planPart:parts[0], onChange:td=>updatePart(0,{typeData:td,actualDistance:td.actualDistance||""})}),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8,marginTop:8}},
        h("div",null,h("label",{className:"lbl"},"Avg HR (bpm)"),h("input",{type:"number",value:f.hr,onChange:e=>s("hr",e.target.value),placeholder:"e.g. 148 — optional",className:"vague"})),
        h("div",null,
          h("label",{className:"lbl"},"Effort: ",h("strong",{style:{color:wt.dark}},f.effort+"/10")),
          h("input",{type:"range",min:"1",max:"10",step:"1",value:f.effort,onChange:e=>s("effort",e.target.value),style:{width:"100%",marginTop:6,accentColor:wt.color}}),
          h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--text-muted)"}},h("span","Easy"),h("span","Max"))
        )
      ),
      h("div",{style:{marginBottom:10}},h("label",{className:"lbl"},"Notes"),h("textarea",{value:f.notes,onChange:e=>s("notes",e.target.value),rows:2,placeholder:"How did it feel?"})),
      h("div",{style:{padding:"8px 10px",background:"var(--info-bg)",borderRadius:6,border:"0.5px solid var(--border-strong)"}},
        h("label",{className:"lbl"},"Cool down KMs inc. strides or accs"),
        h("input",{type:"number",value:f.cd||"",onChange:e=>s("cd",e.target.value),placeholder:"e.g. 2",className:"mono",step:"0.1",style:{maxWidth:120}})
      )

const ReportForm = ({day,daySessions,existingReport,onSave,onCancel}) => {
  const init=existingReport?.sessions||[];
  // Old reports stored wu/cd once per day; migrate that onto the first session's report.
  const [reps,setReps]=useState(daySessions.map((sess,i)=>{
    const base=init[i]?{...init[i]}:{status:"done",effort:"6",hr:"",notes:"",wu:"",cd:""};
    if(i===0){
      if(!base.wu&&existingReport?.wu) base.wu=existingReport.wu;
      if(!base.cd&&existingReport?.cd) base.cd=existingReport.cd;
    }
    return base;
  }));
  const [sleep,setSleep]=useState(existingReport?.sleep||"3");
  const [stress,setStress]=useState(existingReport?.stress||"3");
  const upd=(i,v)=>setReps(r=>{const n=[...r];n[i]=v;return n;});

  const wuKm = reps.reduce((s,r)=>s+(parseFloat(r.wu)||0),0);
  const mainKm = reps.reduce((s,r)=>s+(parseFloat(r.actualDistance)||0),0);
  const cdKm = reps.reduce((s,r)=>s+(parseFloat(r.cd)||0),0);
  const totalKm = wuKm + mainKm + cdKm;

  return h("div",null,
    h("div",{style:{marginBottom:14,fontSize:13,color:"var(--text-muted)"}},daySessions.length+" session"+(daySessions.length>1?"s":"")+" planned for "+day),
    // Wellbeing
    h("div",{style:{background:"var(--surface-alt)",borderRadius:8,padding:"14px 16px",marginBottom:12,border:"0.5px solid var(--border)"}},
      h("div",{style:{fontSize:12,fontWeight:700,color:"var(--text-muted2)",marginBottom:12,textTransform:"uppercase",letterSpacing:"0.06em"}},"How are you feeling today?"),
      h("div",{style:{display:"flex",gap:16}},
        h(SliderScale,{label:"😴 Sleep quality",value:sleep,onChange:setSleep,leftLabel:"Poor",rightLabel:"Excellent",reverse:false}),
        h(SliderScale,{label:"Stress level",value:stress,onChange:setStress,leftLabel:"Relaxed",rightLabel:"Stressed",reverse:true,emojis:["🙂","😐","😣"]})
      )
    ),
    // Sessions — each with its own warm up (top) & cool down (bottom)
    daySessions.map((sess,i)=>h(SessRepForm,{key:i,session:sess,existing:reps[i],onChange:v=>upd(i,v)})),
    // Total KMs summary
    h("div",{style:{background:"var(--surface-alt)",borderRadius:8,padding:"10px 14px",marginBottom:12,border:"0.5px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}},

      ),
      h("div",{style:{fontSize:15,fontWeight:700,color:"var(--text)"}},
        "Total: ",h("span",{className:"mono",style:{color:"var(--accent)"}},totalKm.toFixed(1)," km")

    h("div",{style:{display:"flex",gap:8,justifyContent:"flex-end",marginTop:8}},

// Extract a readable summary from a session report (new or old format)
const repSummary = (rep, parts) => {
  if (!rep) return null;
  const lines = [];
  // New format: partReps with typeData
  if (rep.partReps && rep.partReps.length > 0) {
    rep.partReps.forEach((pr, i) => {
      const part = parts?.[i];
      const td = pr.typeData || {};
      const type = part?.type || "easy";
      const wt = WT[type] || WT.easy;
      const dist = parseFloat(pr.actualDistance || td.actualDistance) || 0;
      let detail = "";
      if (type==="easy"||type==="recovery") detail = td.actualPace ? `@ ${td.actualPace}/km` : "";
      else if (type==="tempo") detail = td.tempoPace ? `tempo @ ${td.tempoPace}/km` : "";
      else if (type==="interval") detail = td.splitNotes ? `splits: ${td.splitNotes.split("\n")[0].slice(0,40)}` : "";
      else if (type==="long") {
        if (td.avgPace) detail += `avg ${td.avgPace}/km`;
        if (td.part1Pace) detail += ` · base ${td.part1Pace}/km`;
        if (td.part2AvgPace) detail += ` · part 2 avg ${td.part2AvgPace}/km`;
        if (td.fasterPace) detail += ` · faster ${td.fasterPace}/km`;
        if (td.transitionPace) detail += ` · transition ${td.transitionPace}/km`;
      }
      else if (type==="fartlek") {
        if (td.avgPace) detail += `avg ${td.avgPace}/km`;
        if (td.fasterPace) detail += `${detail?" · ":""}faster ${td.fasterPace}/km · transition ${td.transitionPace||"–"}/km`;
      }
      else if (type==="hills") {
        const hillRows = td.hillRows||[];
        if (hillRows.length>0) {
          const rowDetails = hillRows.map(r=>{
            const sets=parseFloat(r.sets)||1, reps=parseFloat(r.reps)||0, dist=parseFloat(r.distM)||0;
            const km=(sets*reps*dist/1000);
            return `${sets}×${reps}×${dist}m = ${km.toFixed(3)}km`+(r.avgTime?` @ ${r.avgTime}`:"")+(r.hr?` (${r.hr} bpm)`:"");
          }).join(" | ");
          detail = rowDetails;
        }
        if (td.actualDistance) detail += ` → total ${parseFloat(td.actualDistance).toFixed(3)}km`;
      }
      else if (type==="strength") detail = td.duration ? `${td.duration} min` : "";
      else if (type==="race") detail = td.finishTime ? `finish ${td.finishTime}` : "";
      lines.push({ label: wt.label, dist, detail, color: wt.dark });
    });
  } else {
    // Old format fallback
    const dist = parseFloat(rep.actualDistance) || 0;
    const pace = rep.actualPace ? `@ ${rep.actualPace}/km` : "";
    lines.push({ label: "", dist, detail: pace, color: "var(--text-muted2)" });
  }
  return lines;
};

// Real daily total: main session(s) + warm-up + cool-down, matching what the athlete sees as "Total" in their report
const dayActualKm = r => {
  if (!r?.sessions) return 0;
  if (r.totalKm!=null && r.totalKm!=="") return parseFloat(r.totalKm)||0;
  return r.sessions.reduce((s,rep)=>s+(parseFloat(rep.actualDistance)||0)+(parseFloat(rep.wu)||0)+(parseFloat(rep.cd)||0),0);
};

const printWeeklySummary = (athlete, plan, reports, weekOff) => {
  const weekStart = getWeekStart(weekOff);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
  const dateStamp = weekKey(weekOff); // YYYY-MM-DD, filename-safe
  const dateRangeFull = `${weekStart.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${weekEnd.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`;
  const totalPlanned = DAYS.reduce((s,d)=>s+dayTotalKm(plan[d]),0);
  const totalActual = DAYS.reduce((s,day)=>s+dayActualKm(reports[day]),0);
  const workoutDays = DAYS.filter(d=>!dayIsRest(plan[d]));
  const doneDays = workoutDays.filter(d=>reports[d]?.sessions?.some(s=>s.status==="done"||s.status==="modified"));
  const allEfforts = DAYS.flatMap(d=>(reports[d]?.sessions||[]).map(s=>parseFloat(s.effort)||0)).filter(Boolean);
  const avgEffort = allEfforts.length ? (allEfforts.reduce((a,b)=>a+b,0)/allEfforts.length).toFixed(1) : "–";

  const avgSleep = sleepVals.length ? (sleepVals.reduce((a,b)=>a+b,0)/sleepVals.length).toFixed(1) : "–";
  const avgStress = stressVals.length ? (stressVals.reduce((a,b)=>a+b,0)/stressVals.length).toFixed(1) : "–";

  const dayRows = DAYS.map(day=>{
    const d=plan[day]; const r=reports[day];

    const actualKm = r?.sessions ? dayActualKm(r).toFixed(1) : "–";

    const effort = r?.sessions

      : "–";

    const sleep = r?.sleep ? r.sleep+"/5" : "–";

              rep.actualDistance&&h("div",null,h("div",{style:{color:"var(--text-muted)",fontSize:10,marginBottom:2,fontWeight:600}},"DISTANCE"),h("strong",{className:"mono"},rep.actualDistance+" km")),
              rep.cd&&h("div",null,h("div",{style:{color:"var(--text-muted)",fontSize:10,marginBottom:2,fontWeight:600}},"COOL DOWN"),h("strong",{className:"mono"},rep.cd+" km")),

              rep.hr&&h("div",null,h("div",{style:{color:"var(--text-muted)",fontSize:10,marginBottom:2,fontWeight:600}},"HR"),h("strong",{className:"mono"},rep.hr+" bpm")),
